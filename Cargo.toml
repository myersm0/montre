[workspace]
resolver = "2"
members = [
	"crates/montre-core",
	"crates/montre-index",
	"crates/montre-query",
	"crates/montre-build",
	"crates/montre-cli",
]
exclude = ["crates/montre-py",]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yourusername/montre"

[workspace.dependencies]
# Internal crates
montre-core = { path = "crates/montre-core" }
montre-index = { path = "crates/montre-index" }
montre-query = { path = "crates/montre-query" }
montre-build = { path = "crates/montre-build" }

# Core dependencies
roaring = { version = "0.10", features = ["serde"] }
fst = "0.4"
memmap2 = "0.9"
compact_str = { version = "0.8", features = ["serde"] }
smallvec = { version = "1.13", features = ["union", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Parsing
winnow = "0.6"
regex = "1.11"

# Parallelism
rayon = "1.10"

# Testing
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2.0"
predicates = "3.1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true

